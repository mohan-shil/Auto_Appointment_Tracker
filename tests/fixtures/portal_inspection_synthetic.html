<!doctype html>
<html><head><title>Appointment Login</title></head>
<body>
  <nav><a href="/">Home</a><a href="/appointment?email=someone@example.test#step">Appointment</a></nav>
  <h1>Appointment Login</h1>
  <button type="button">Continue</button>
  <label for="email">Email</label><input id="email" type="email" value="someone@example.test" required>
  <label for="password">Password</label><input id="password" type="password" value="secret">
  <label for="otp">OTP</label><input id="otp" type="text" value="123456">
  <label for="centre">Select centre</label><select id="centre"><option>Select an option</option><option>Dhaka</option></select>
  <label for="webfile">Upload Webfile</label><input id="webfile" type="file" accept=".pdf,application/pdf">
  <div class="captcha-widget" data-sitekey="DO_NOT_READ">CAPTCHA</div>
</body></html>

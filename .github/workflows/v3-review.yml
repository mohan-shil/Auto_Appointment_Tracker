name: V3 and preserved V2 tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - codex/v3-review-fixes
      - codex/v3-node-playwright-mock

jobs:
  v3:
    name: V3 mock and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  v2:
    name: Preserved V2 regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: legacy/v2/requirements.txt
      - run: python -m pip install -r legacy/v2/requirements.txt
      - run: npm run test:v2
